<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Filtros - CSV Automático</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Sistema 100% Front – CSV Automático</h2>
<p>Os dados são carregados automaticamente do arquivo <b>dados.csv</b></p>

<div class="filtros">
<input id="fNome" placeholder="Nome">
<input id="fCidade" placeholder="Cidade">
<select id="fDisciplina">
<option value="">Todas as disciplinas</option>
</select>
<select id="fStatus">
<option value="">Status</option>
<option>Ativo</option>
<option>Inativo</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Nome</th>
<th>Cidade</th>
<th>Disciplinas</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="pagination" id="pagination"></div>

<script>
let dados=[],filtrados=[],pagina=1,porPagina=3;

fetch('dados.csv')
.then(r=>r.text())
.then(txt=>{
 const linhas=txt.trim().split('\n').slice(1);
 const setDisciplinas=new Set();
 dados=linhas.map(l=>{
   const [nome,cidade,disc,status]=l.split(',');
   const disciplinas=disc.replace(/"/g,'').split('|');
   disciplinas.forEach(d=>setDisciplinas.add(d));
   return {nome,cidade,disciplinas,status};
 });
 popularDisciplinas([...setDisciplinas]);
 filtrados=[...dados];
 render();
});

function popularDisciplinas(lista){
 const sel=document.getElementById('fDisciplina');
 lista.forEach(d=>{
  const o=document.createElement('option');
  o.textContent=d;
  sel.appendChild(o);
 });
}

document.querySelectorAll("#fNome,#fCidade,#fDisciplina,#fStatus")
.forEach(e=>e.addEventListener("input",()=>{pagina=1;filtrar();}));

function filtrar(){
 const nome=fNome.value.toLowerCase();
 const cidade=fCidade.value.toLowerCase();
 const disc=fDisciplina.value;
 const status=fStatus.value;

 filtrados=dados.filter(d=>
  d.nome.toLowerCase().includes(nome) &&
  d.cidade.toLowerCase().includes(cidade) &&
  (disc==""||d.disciplinas.includes(disc)) &&
  (status==""||d.status==status)
 );
 render();
}

function render(){
 const tb=document.getElementById("tbody");
 tb.innerHTML="";
 const ini=(pagina-1)*porPagina;
 filtrados.slice(ini,ini+porPagina).forEach(d=>{
  tb.innerHTML+=`<tr>
   <td>${d.nome}</td>
   <td>${d.cidade}</td>
   <td>${d.disciplinas.map(x=>'<span class="tag">'+x+'</span>').join('')}</td>
   <td>${d.status}</td>
  </tr>`;
 });
 renderPag();
}

function renderPag(){
 const p=document.getElementById("pagination");
 p.innerHTML="";
 const total=Math.ceil(filtrados.length/porPagina);
 for(let i=1;i<=total;i++){
  p.innerHTML+=`<button onclick="pagina=${i};render()">${i}</button>`;
 }
}
</script>

</body>
</html>
